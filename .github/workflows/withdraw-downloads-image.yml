name: Withdraw Downloads image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  withdraw:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore previous latest and remove withdrawn image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          repository = 'ghcr.io/themartz90/jellydash'
          endpoint = '/users/themartz90/packages/container/jellydash/versions'

          def command(*args):
              return subprocess.check_output(args, text=True)

          def versions():
              pages = json.loads(command('gh', 'api', endpoint + '?per_page=100', '--paginate', '--slurp'))
              return [version for page in pages for version in page]

          def tags(version):
              return set(version['metadata']['container']['tags'])

          def one_tagged(rows, tag):
              found = [row for row in rows if tag in tags(row)]
              if len(found) != 1:
                  raise RuntimeError('Expected exactly one image tagged ' + tag)
              return found[0]

          rows = versions()
          withdrawn = one_tagged(rows, '1.13.0')
          previous = one_tagged(rows, '1.12.0')
          latest = one_tagged(rows, 'latest')
          if latest['name'] not in (withdrawn['name'], previous['name']):
              raise RuntimeError('Latest changed unexpectedly; refusing to overwrite it.')
          if not tags(withdrawn).issubset({'1.13.0', '1.13', 'latest'}):
              raise RuntimeError('Withdrawn image has unrelated tags.')

          def digests(version):
              manifest = json.loads(command('docker', 'buildx', 'imagetools', 'inspect', '--raw', repository + '@' + version['name']))
              return {version['name']} | {item['digest'] for item in manifest.get('manifests', [])}

          protected = digests(previous)
          targets = digests(withdrawn) - protected
          if withdrawn['name'] not in targets:
              raise RuntimeError('Withdrawn and previous images unexpectedly overlap.')
          for row in rows:
              if row['name'] in targets and not tags(row).issubset({'1.13.0', '1.13', 'latest'}):
                  raise RuntimeError('A target image has unrelated tags.')

          subprocess.run(['docker', 'buildx', 'imagetools', 'create', '--tag', repository + ':latest', repository + '@' + previous['name']], check=True)
          refreshed = versions()
          if one_tagged(refreshed, 'latest')['name'] != previous['name']:
              raise RuntimeError('Previous latest was not restored; stopping before deletion.')
          deleted = []
          for row in sorted(refreshed, key=lambda row: row['name'] != withdrawn['name']):
              if row['name'] in targets:
                  if not tags(row).issubset({'1.13.0', '1.13'}):
                      raise RuntimeError('A target gained a tag; stopping deletion.')
                  subprocess.run(['gh', 'api', '--method', 'DELETE', endpoint + '/' + str(row['id'])], check=True)
                  deleted.append(row['name'])
          remaining = versions()
          if one_tagged(remaining, 'latest')['name'] != previous['name']:
              raise RuntimeError('Latest verification failed.')
          if any(row['name'] in targets or tags(row).intersection({'1.13.0', '1.13'}) for row in remaining):
              raise RuntimeError('Withdrawn image versions remain.')
          print('Restored latest to v1.12.0:', previous['name'])
          print('Removed withdrawn image manifests:', len(deleted))
          PY
